[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-clipboard-cleaner"
version = "0.1.0"
description = "Clean invisible characters and awkward whitespace from copied text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ydsveluvolu2996" }]
keywords = ["clipboard", "macos", "unicode", "text"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.scripts]
pbclean = "pbclean.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
